<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunrise Sunset Scheduler — Golden Hour Planner</title>
  <style>
    :root {
      --bg: #02091a;
      --surface: rgba(255,255,255,0.08);
      --surface2: rgba(255,255,255,0.13);
      --border: rgba(255,255,255,0.16);
      --accent: #38bdf8;
      --accent2: #fb923c;
      --text: rgba(255,255,255,0.95);
      --muted: rgba(255,255,255,0.5);
      --green: #34d399;
      --yellow: #fbbf24;
      --radius: 20px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background gradient */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 10%, rgba(56,189,248,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(251,146,60,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .app-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--yellow), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(247,201,72,0.3); }
      50% { box-shadow: 0 0 0 8px rgba(247,201,72,0); }
    }

    .logo-text h1 {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--yellow), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .logo-text p {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b7cf8);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(56,189,248,0.4);
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(251,146,60,0.15);
      color: var(--accent2);
      border: 1px solid rgba(251,146,60,0.3);
    }

    .btn-danger:hover {
      background: rgba(251,146,60,0.25);
    }

    .btn-green {
      background: rgba(67,217,173,0.15);
      color: var(--green);
      border: 1px solid rgba(67,217,173,0.3);
    }

    .btn-green:hover {
      background: rgba(67,217,173,0.25);
    }

    .btn-sm {
      padding: 0.35rem 0.7rem;
      font-size: 0.78rem;
    }

    /* Search section */
    .search-section {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-wrap input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-wrap input::placeholder { color: var(--muted); }

    .search-wrap input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
    }

    .search-wrap .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 1rem;
    }

    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: var(--shadow);
    }

    .autocomplete-item {
      padding: 0.65rem 1rem;
      cursor: pointer;
      font-size: 0.88rem;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .autocomplete-item:hover, .autocomplete-item:focus {
      background: var(--surface2);
    }

    .autocomplete-item .city-country {
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* Date input */
    .date-wrap input {
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      transition: border-color 0.2s;
      cursor: pointer;
      min-width: 160px;
    }

    .date-wrap input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
    }

    /* Sun arc visualization */
    .sun-arc-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .sun-arc-container::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to top, rgba(247,201,72,0.04), transparent);
      pointer-events: none;
    }

    .arc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .arc-location {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .arc-date {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .arc-day-length {
      text-align: right;
    }

    .arc-day-length .length-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--yellow);
    }

    .arc-day-length .length-label {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .arc-svg-wrap {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      display: block;
    }

    /* Sun times grid */
    .sun-times-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .sun-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      transition: all 0.2s ease;
      cursor: default;
    }

    .sun-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(56,189,248,0.15);
    }

    .sun-card-icon {
      font-size: 1.5rem;
      margin-bottom: 0.4rem;
    }

    .sun-card-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .sun-card-time {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }

    .sun-card-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .sun-card.golden { border-left: 3px solid var(--yellow); }
    .sun-card.blue-hour { border-left: 3px solid var(--accent); }
    .sun-card.rise { border-left: 3px solid var(--green); }
    .sun-card.set { border-left: 3px solid var(--accent2); }
    .sun-card.noon { border-left: 3px solid var(--yellow); }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.3rem;
      margin-bottom: 1.5rem;
      width: fit-content;
    }

    .tab-btn {
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(56,189,248,0.35);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text);
      background: var(--surface2);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* 7-day calendar */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .week-day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 0.5rem;
      text-align: center;
      transition: all 0.2s;
      cursor: pointer;
    }

    .week-day:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .week-day.today {
      border-color: var(--yellow);
      box-shadow: 0 0 12px rgba(247,201,72,0.2);
    }

    .week-day.selected {
      background: rgba(56,189,248,0.15);
      border-color: var(--accent);
    }

    .week-day-name {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .week-day-num {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .week-day-bar {
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--yellow), var(--accent2));
      margin: 0 auto 0.4rem;
      transition: width 0.4s ease;
    }

    .week-day-times {
      font-size: 0.65rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Scheduler section */
    .scheduler-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .scheduler-panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .add-task-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-group input,
    .form-group select {
      padding: 0.6rem 0.85rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.88rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-group select option {
      background: var(--surface2);
    }

    /* Task list */
    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: all 0.2s;
      animation: slide-in 0.25s ease;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover {
      border-color: var(--accent);
    }

    .task-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .task-name {
      flex: 1;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .task-time-badge {
      padding: 0.25rem 0.6rem;
      background: rgba(56,189,248,0.15);
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 6px;
      font-size: 0.75rem;
      color: var(--accent);
      white-space: nowrap;
    }

    .task-computed-time {
      font-size: 0.78rem;
      color: var(--green);
      font-weight: 600;
      min-width: 60px;
      text-align: right;
    }

    .task-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 4px;
      transition: color 0.2s;
      font-size: 1rem;
    }

    .task-delete:hover { color: var(--accent2); }

    /* Sessions (saved shoots) */
    .sessions-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.75rem;
    }

    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .session-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--yellow), var(--accent2));
    }

    .session-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .session-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .session-card-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .session-card-location {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .session-card-badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .badge {
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .badge-gold {
      background: rgba(247,201,72,0.15);
      color: var(--yellow);
      border: 1px solid rgba(247,201,72,0.3);
    }

    .badge-blue {
      background: rgba(56,189,248,0.15);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.3);
    }

    .session-card-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 0.9rem;
    }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 1000;
    }

    .toast {
      padding: 0.75rem 1.25rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: toast-in 0.3s ease;
      min-width: 220px;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .toast.success { border-left: 3px solid var(--green); }
    .toast.error { border-left: 3px solid var(--accent2); }
    .toast.info { border-left: 3px solid var(--accent); }

    /* Loading spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Skeleton loaders */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Section headers */
    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
    }

    /* Status indicator */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.live {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Now indicator */
    .now-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--green);
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 720px) {
      .add-task-form {
        grid-template-columns: 1fr 1fr;
      }
      .week-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 480px) {
      header { flex-direction: column; gap: 1rem; align-items: flex-start; }
      .sun-times-grid { grid-template-columns: repeat(2, 1fr); }
      .week-grid { grid-template-columns: repeat(3, 1fr); }
      .add-task-form { grid-template-columns: 1fr; }
    }

    /* Share modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fade-in 0.2s ease;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow);
      animation: modal-in 0.25s ease;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(-20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .modal-title {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.25rem;
      padding: 0.25rem;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    .modal-close:hover { color: var(--text); }

    .share-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      font-family: monospace;
      font-size: 0.82rem;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--text);
    }

    /* Coordinate display */
    .coords-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .coords-bar span { display: flex; align-items: center; gap: 0.3rem; }

/* ── Weather design system v2 ── */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(180deg, #02091a 0%, #0d1f3c 50%, #153050 100%) fixed;
  min-height: 100vh;
  color: rgba(255,255,255,0.9);
}
body::before {
  content: '';
  position: fixed;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56,189,248,.12) 0%, transparent 70%);
  top: -150px; right: -100px;
  animation: floatOrb 10s ease-in-out infinite;
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(251,146,60,.08) 0%, transparent 70%);
  bottom: 8%; left: -80px;
  animation: floatOrb 14s ease-in-out infinite reverse;
  pointer-events: none; z-index: 0;
}
/* Glassmorphism cards */
.card,[class*="card"],[class*="widget"],[class*="panel"],[class*="result"] {
  background: rgba(255,255,255,0.08) !important;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.18) !important;
  border-radius: 20px !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 8px 32px rgba(0,0,0,0.3);
}
h1 {
  font-weight: 200;
  font-size: clamp(2.5rem, 7vw, 5rem);
  letter-spacing: -.02em;
  color: rgba(255,255,255,0.95);
  text-shadow: 0 0 30px rgba(56,189,248,.4);
  -webkit-text-fill-color: rgba(255,255,255,0.95);
}
h2, h3 { font-weight: 300; color: rgba(255,255,255,0.85); letter-spacing: -.01em; -webkit-text-fill-color: rgba(255,255,255,0.85); }
p, label, span, td, th, li { color: rgba(255,255,255,0.8); }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
@keyframes floatOrb { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-22px) scale(1.04);} }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
@keyframes glowPulse { 0%,100%{text-shadow:0 0 10px rgba(56,189,248,.4);} 50%{text-shadow:0 0 30px rgba(56,189,248,.9),0 0 60px rgba(56,189,248,.3);} }
@keyframes alertPulse { 0%,100%{box-shadow:0 0 0 0 rgba(251,146,60,.5);} 50%{box-shadow:0 0 0 8px rgba(251,146,60,0);} }
.card,[class*="card"],[class*="widget"],[class*="panel"],[class*="result"] { animation: fadeUp .5s ease both; }
.card:nth-child(2){animation-delay:.08s} .card:nth-child(3){animation-delay:.16s} .card:nth-child(4){animation-delay:.24s}
[class*="alert"],[class*="warning"] { animation: alertPulse 2s ease-in-out infinite; }
button,[class*="btn"] {
  background: rgba(255,255,255,0.1) !important;
  border: 1px solid rgba(255,255,255,0.22) !important;
  backdrop-filter: blur(8px);
  color: rgba(255,255,255,0.9) !important;
  transition: all .2s;
  border-radius: 12px;
}
button:hover,[class*="btn"]:hover {
  background: rgba(56,189,248,0.2) !important;
  border-color: rgba(56,189,248,0.5) !important;
  box-shadow: 0 4px 20px rgba(56,189,248,.3);
  transform: translateY(-1px);
}
input, select {
  background: rgba(255,255,255,0.08) !important;
  border: 1px solid rgba(255,255,255,0.16) !important;
  backdrop-filter: blur(8px);
  color: rgba(255,255,255,0.9) !important;
}
input::placeholder { color: rgba(255,255,255,0.4); }
input:focus, select:focus {
  border-color: rgba(56,189,248,.6) !important;
  box-shadow: 0 0 0 3px rgba(56,189,248,.2);
  outline: none;
}
select option { background: #0d1f3c; color: white; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <header>
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">🌅</div>
      <div class="logo-text">
        <h1>Sunrise Sunset Scheduler</h1>
        <p>Golden hour planner for photographers</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="now-indicator">
        <span class="status-dot live"></span>
        <span id="live-clock">--:--</span>
      </div>
      <button class="btn btn-secondary" id="btn-use-location" aria-label="Use my location">
        📍 My Location
      </button>
    </div>
  </header>

  <!-- Search -->
  <div class="search-section" role="search" aria-label="Location and date search">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input
        type="text"
        id="city-input"
        placeholder="Search city or location…"
        autocomplete="off"
        aria-label="Search city"
        aria-autocomplete="list"
        aria-controls="autocomplete-list"
      />
      <div class="autocomplete-list" id="autocomplete-list" role="listbox" aria-label="City suggestions" style="display:none;"></div>
    </div>
    <div class="date-wrap">
      <input type="date" id="date-input" aria-label="Select date" />
    </div>
    <button class="btn btn-primary" id="btn-search">
      <span id="search-btn-content">Search</span>
    </button>
  </div>

  <!-- Coords bar (hidden until location selected) -->
  <div class="coords-bar" id="coords-bar" style="display:none;" aria-live="polite">
    <span>📌 <strong id="coords-location-name">—</strong></span>
    <span>Lat: <strong id="coords-lat">—</strong></span>
    <span>Lng: <strong id="coords-lng">—</strong></span>
  </div>

  <!-- Sun arc visualization -->
  <div class="sun-arc-container" id="arc-container" style="display:none;" aria-label="Sun arc visualization">
    <div class="arc-header">
      <div>
        <div class="arc-location" id="arc-location-name">—</div>
        <div class="arc-date" id="arc-date-display">—</div>
      </div>
      <div class="arc-day-length">
        <div class="length-value" id="arc-day-length">—</div>
        <div class="length-label">Day Length</div>
      </div>
    </div>
    <svg class="arc-svg-wrap" id="arc-svg" viewBox="0 0 640 200" aria-hidden="true">
      <defs>
        <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a2240"/>
          <stop offset="100%" stop-color="#0f1117"/>
        </linearGradient>
        <linearGradient id="sun-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f7c948"/>
          <stop offset="100%" stop-color="#ff6584"/>
        </linearGradient>
      </defs>
      <!-- Sky background -->
      <rect x="0" y="0" width="640" height="180" rx="8" fill="url(#sky-grad)"/>
      <!-- Horizon line -->
      <line x1="20" y1="170" x2="620" y2="170" stroke="#2e3350" stroke-width="1.5"/>
      <!-- Arc path -->
      <path id="arc-path" d="" stroke="rgba(247,201,72,0.3)" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
      <!-- Golden hour zones -->
      <rect id="golden-morn-rect" x="0" y="0" width="0" height="170" fill="rgba(247,201,72,0.06)" rx="0"/>
      <rect id="golden-eve-rect" x="0" y="0" width="0" height="170" fill="rgba(255,101,132,0.06)" rx="0"/>
      <!-- Sun circle -->
      <circle id="arc-sun" cx="320" cy="80" r="14" fill="url(#sun-grad)" filter="url(#glow)"/>
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Time labels -->
      <text id="arc-rise-label" x="40" y="188" font-size="10" fill="#8892b0" text-anchor="middle">—</text>
      <text id="arc-noon-label" x="320" y="188" font-size="10" fill="#8892b0" text-anchor="middle">Noon</text>
      <text id="arc-set-label" x="600" y="188" font-size="10" fill="#8892b0" text-anchor="middle">—</text>
    </svg>
  </div>

  <!-- Sun time cards -->
  <div class="sun-times-grid" id="sun-times-grid" aria-live="polite"></div>

  <!-- Tabs -->
  <div class="tabs" role="tablist" aria-label="View sections" id="main-tabs" style="display:none;">
    <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="tab-week" data-tab="week">📅 7-Day View</button>
    <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-scheduler" data-tab="scheduler">⏰ Task Scheduler</button>
    <button class="tab-btn" role="tab" aria-selected="false" aria-controls="tab-sessions" data-tab="sessions">📁 Saved Sessions</button>
  </div>

  <!-- Tab: Week view -->
  <div class="tab-panel active" id="tab-week" role="tabpanel">
    <div class="section-title">7-Day Sun Calendar</div>
    <div class="week-grid" id="week-grid" aria-label="7-day sun times"></div>
  </div>

  <!-- Tab: Scheduler -->
  <div class="tab-panel" id="tab-scheduler" role="tabpanel">
    <div class="scheduler-panel">
      <h2>⏰ Schedule Tasks Relative to Sun Times</h2>
      <div class="add-task-form" role="form" aria-label="Add scheduled task">
        <div class="form-group">
          <label for="task-name-input">Task / Session Name</label>
          <input type="text" id="task-name-input" placeholder="e.g. Portrait Shoot" />
        </div>
        <div class="form-group">
          <label for="task-anchor">Relative To</label>
          <select id="task-anchor">
            <option value="sunrise">Sunrise</option>
            <option value="sunset">Sunset</option>
            <option value="solar_noon">Solar Noon</option>
            <option value="golden_morning">Morning Golden Hour</option>
            <option value="golden_evening">Evening Golden Hour</option>
            <option value="blue_morning">Morning Blue Hour</option>
            <option value="blue_evening">Evening Blue Hour</option>
            <option value="civil_twilight_begin">Civil Twilight Begin</option>
            <option value="civil_twilight_end">Civil Twilight End</option>
          </select>
        </div>
        <div class="form-group">
          <label for="task-offset">Offset (minutes)</label>
          <input type="number" id="task-offset" value="0" min="-180" max="180" step="5" />
        </div>
        <div class="form-group">
          <label for="task-color">Color</label>
          <select id="task-color">
            <option value="#6c63ff">Purple</option>
            <option value="#43d9ad">Green</option>
            <option value="#f7c948">Gold</option>
            <option value="#ff6584">Pink</option>
            <option value="#38bdf8">Blue</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btn-add-task" style="align-self: end; height: 38px;">+ Add</button>
      </div>
      <div class="tasks-list" id="tasks-list" aria-live="polite" aria-label="Scheduled tasks"></div>
    </div>
  </div>

  <!-- Tab: Sessions -->
  <div class="tab-panel" id="tab-sessions" role="tabpanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
      <div class="section-title" style="margin:0;">Saved Shoot Sessions</div>
      <button class="btn btn-primary btn-sm" id="btn-save-session" style="display:none;">💾 Save Current</button>
    </div>
    <div class="sessions-list" id="sessions-list" aria-live="polite"></div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>

<!-- Share/Export modal -->
<div class="modal-backdrop" id="modal-backdrop" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Session Card</div>
      <button class="modal-close" id="modal-close" aria-label="Close modal">✕</button>
    </div>
    <div class="share-card" id="modal-share-card"></div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn btn-green" id="modal-copy-btn">📋 Copy Text</button>
      <button class="btn btn-primary" id="modal-ics-btn">📅 Download ICS</button>
    </div>
  </div>
</div>

<script>
  // ===== STATE =====
  const state = {
    location: null,   // { name, lat, lng }
    date: null,       // YYYY-MM-DD string
    sunData: null,    // raw API response
    weekData: [],     // array of 7 day sun results
    tasks: JSON.parse(localStorage.getItem('sss-tasks') || '[]'),
    sessions: JSON.parse(localStorage.getItem('sss-sessions') || '[]'),
    modalSession: null,
    loading: false,
  };

  // ===== UTILS =====
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function formatTime(isoStr, tz) {
    if (!isoStr || isoStr === 'always_up' || isoStr === 'always_down') return '--:--';
    const d = new Date(isoStr);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
  }

  function formatDuration(seconds) {
    if (!seconds || isNaN(seconds)) return '--';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return `${h}h ${m}m`;
  }

  function addMinutes(isoStr, mins) {
    if (!isoStr || isoStr === 'always_up' || isoStr === 'always_down') return null;
    const d = new Date(isoStr);
    d.setMinutes(d.getMinutes() + mins);
    return d;
  }

  function showToast(msg, type = 'info') {
    const tc = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    const icons = { success: '✅', error: '❌', info: 'ℹ️' };
    t.innerHTML = `<span>${icons[type] || ''}</span> ${msg}`;
    tc.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.4s'; setTimeout(() => t.remove(), 400); }, 3500);
  }

  function saveTasks() {
    localStorage.setItem('sss-tasks', JSON.stringify(state.tasks));
  }

  function saveSessions() {
    localStorage.setItem('sss-sessions', JSON.stringify(state.sessions));
  }

  // ===== CLOCK =====
  function updateClock() {
    const now = new Date();
    document.getElementById('live-clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===== DATE INIT =====
  const dateInput = document.getElementById('date-input');
  dateInput.value = todayStr();
  state.date = todayStr();
  dateInput.addEventListener('change', () => {
    state.date = dateInput.value;
    if (state.location) fetchAndRender();
  });

  // ===== GEOCODING =====
  let autocompleteTimeout = null;
  const cityInput = document.getElementById('city-input');
  const autocompleteList = document.getElementById('autocomplete-list');

  cityInput.addEventListener('input', () => {
    clearTimeout(autocompleteTimeout);
    const q = cityInput.value.trim();
    if (q.length < 2) { autocompleteList.style.display = 'none'; return; }
    autocompleteTimeout = setTimeout(() => fetchCities(q), 300);
  });

  cityInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { autocompleteList.style.display = 'none'; }
    if (e.key === 'Enter') { document.getElementById('btn-search').click(); }
  });

  async function fetchCities(q) {
    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
      const data = await res.json();
      renderAutocomplete(data.results || []);
    } catch {
      autocompleteList.style.display = 'none';
    }
  }

  function renderAutocomplete(results) {
    if (!results.length) { autocompleteList.style.display = 'none'; return; }
    autocompleteList.innerHTML = results.map((r, i) =>
      `<div class="autocomplete-item" tabindex="0" role="option" data-i="${i}" data-lat="${r.latitude}" data-lng="${r.longitude}" data-name="${r.name}, ${r.country || ''}">
        <span>🏙️</span>
        <span>${r.name}</span>
        <span class="city-country">${r.admin1 ? r.admin1 + ', ' : ''}${r.country || ''}</span>
      </div>`
    ).join('');
    autocompleteList.style.display = 'block';
    autocompleteList.querySelectorAll('.autocomplete-item').forEach(el => {
      el.addEventListener('click', () => selectCity(el));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') selectCity(el); });
    });
  }

  function selectCity(el) {
    state.location = {
      name: el.dataset.name,
      lat: parseFloat(el.dataset.lat),
      lng: parseFloat(el.dataset.lng),
    };
    cityInput.value = el.dataset.name;
    autocompleteList.style.display = 'none';
    updateCoordsBar();
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) autocompleteList.style.display = 'none';
  });

  // ===== SEARCH BUTTON =====
  document.getElementById('btn-search').addEventListener('click', () => {
    if (!state.location) {
      showToast('Please select a city first', 'error');
      cityInput.focus();
      return;
    }
    fetchAndRender();
  });

  // ===== MY LOCATION =====
  document.getElementById('btn-use-location').addEventListener('click', () => {
    if (!navigator.geolocation) { showToast('Geolocation not supported', 'error'); return; }
    const btn = document.getElementById('btn-use-location');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Locating…`;
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const { latitude: lat, longitude: lng } = pos.coords;
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=&latitude=${lat}&longitude=${lng}`);
        // Reverse geocoding not available in open-meteo, use coordinates directly
        state.location = { name: `${lat.toFixed(4)}, ${lng.toFixed(4)}`, lat, lng };
        cityInput.value = state.location.name;
        updateCoordsBar();
        fetchAndRender();
      } catch {
        state.location = { name: `${lat.toFixed(4)}, ${lng.toFixed(4)}`, lat, lng };
        cityInput.value = state.location.name;
        updateCoordsBar();
        fetchAndRender();
      }
      btn.disabled = false;
      btn.innerHTML = '📍 My Location';
    }, (err) => {
      showToast('Location access denied', 'error');
      btn.disabled = false;
      btn.innerHTML = '📍 My Location';
    });
  });

  function updateCoordsBar() {
    if (!state.location) return;
    document.getElementById('coords-bar').style.display = 'flex';
    document.getElementById('coords-location-name').textContent = state.location.name;
    document.getElementById('coords-lat').textContent = state.location.lat.toFixed(4);
    document.getElementById('coords-lng').textContent = state.location.lng.toFixed(4);
  }

  // ===== FETCH SUN DATA =====
  async function fetchSunData(lat, lng, date) {
    const url = `https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&date=${date}&formatted=0`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.status !== 'OK') throw new Error('API error');
    return data.results;
  }

  async function fetchAndRender() {
    if (!state.location || !state.date) return;
    setSearchLoading(true);
    try {
      // Fetch today + 6 more days in parallel
      const dates = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(state.date + 'T12:00:00');
        d.setDate(d.getDate() + i);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      });
      const [primary, ...rest] = await Promise.all(
        dates.map(dt => fetchSunData(state.location.lat, state.location.lng, dt))
      );
      state.sunData = primary;
      state.weekData = [primary, ...rest].map((r, i) => ({ date: dates[i], data: r }));

      renderSunCards(primary, state.date);
      renderArc(primary, state.date);
      renderWeekGrid();
      renderTasks();
      document.getElementById('main-tabs').style.display = 'flex';
      document.getElementById('btn-save-session').style.display = 'inline-flex';
      showToast(`Loaded sun times for ${state.location.name}`, 'success');
    } catch (e) {
      showToast('Failed to load sun data. Check connection.', 'error');
    } finally {
      setSearchLoading(false);
    }
  }

  function setSearchLoading(on) {
    const btn = document.getElementById('search-btn-content');
    btn.innerHTML = on ? `<span class="spinner"></span>` : 'Search';
    document.getElementById('btn-search').disabled = on;
  }

  // ===== COMPUTE GOLDEN / BLUE HOURS =====
  function computeGoldenBlue(data) {
    // Golden hour: ~30-60 min after sunrise, ~30-60 min before sunset
    // Blue hour: civil twilight
    return {
      golden_morning_start: data.civil_twilight_begin,
      golden_morning_end: data.sunrise
        ? addMinutes(data.sunrise, 60)?.toISOString()
        : null,
      golden_evening_start: data.sunset
        ? addMinutes(data.sunset, -60)?.toISOString()
        : null,
      golden_evening_end: data.civil_twilight_end,
      blue_morning_start: addMinutes(data.civil_twilight_begin, -30)?.toISOString(),
      blue_morning_end: data.civil_twilight_begin,
      blue_evening_start: data.civil_twilight_end,
      blue_evening_end: addMinutes(data.civil_twilight_end, 30)?.toISOString(),
    };
  }

  // ===== SUN CARDS =====
  function renderSunCards(data, date) {
    const gb = computeGoldenBlue(data);
    const grid = document.getElementById('sun-times-grid');

    const cards = [
      { cls: 'rise', icon: '🌅', label: 'Sunrise', time: formatTime(data.sunrise), sub: 'Sun rises above horizon' },
      { cls: 'set', icon: '🌇', label: 'Sunset', time: formatTime(data.sunset), sub: 'Sun sets below horizon' },
      { cls: 'noon', icon: '☀️', label: 'Solar Noon', time: formatTime(data.solar_noon), sub: 'Sun at highest point' },
      { cls: '', icon: '🌄', label: 'Civil Twilight AM', time: formatTime(data.civil_twilight_begin), sub: 'Dawn begins' },
      { cls: '', icon: '🌆', label: 'Civil Twilight PM', time: formatTime(data.civil_twilight_end), sub: 'Dusk ends' },
      { cls: 'golden', icon: '🌟', label: 'Morning Golden Hour', time: `${formatTime(gb.golden_morning_start)} – ${formatTime(gb.golden_morning_end)}`, sub: 'Warm, soft light' },
      { cls: 'golden', icon: '✨', label: 'Evening Golden Hour', time: `${formatTime(gb.golden_evening_start)} – ${formatTime(gb.golden_evening_end)}`, sub: 'Magic light window' },
      { cls: 'blue-hour', icon: '💙', label: 'Morning Blue Hour', time: `${formatTime(gb.blue_morning_start)} – ${formatTime(gb.blue_morning_end)}`, sub: 'Cool, diffuse light' },
      { cls: 'blue-hour', icon: '🌙', label: 'Evening Blue Hour', time: `${formatTime(gb.blue_evening_start)} – ${formatTime(gb.blue_evening_end)}`, sub: 'Moody, cinematic look' },
    ];

    grid.innerHTML = cards.map(c =>
      `<div class="sun-card ${c.cls}" tabindex="0" role="article" aria-label="${c.label}: ${c.time}">
        <div class="sun-card-icon">${c.icon}</div>
        <div class="sun-card-label">${c.label}</div>
        <div class="sun-card-time">${c.time}</div>
        <div class="sun-card-sub">${c.sub}</div>
      </div>`
    ).join('');

    // Day length
    document.getElementById('arc-day-length').textContent = formatDuration(data.day_length);
  }

  // ===== ARC VISUALIZATION =====
  function renderArc(data, date) {
    const container = document.getElementById('arc-container');
    container.style.display = 'block';

    document.getElementById('arc-location-name').textContent = state.location.name;
    const d = new Date(date + 'T12:00:00');
    document.getElementById('arc-date-display').textContent = d.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    if (!data.sunrise || data.sunrise === 'always_up' || data.sunrise === 'always_down') return;

    const rise = new Date(data.sunrise);
    const set = new Date(data.sunset);
    const noon = new Date(data.solar_noon);

    // Map time to x position (sunrise at ~80px, sunset at ~560px)
    const dayStart = rise.getTime() - 30 * 60000;
    const dayEnd = set.getTime() + 30 * 60000;
    const dayLen = dayEnd - dayStart;

    function timeToX(ts) {
      return 80 + ((ts - dayStart) / dayLen) * 480;
    }

    const riseX = 80;
    const setX = 560;
    const noonX = timeToX(noon.getTime());
    const midY = 60;

    // Arc path: semicircle from rise to set
    const path = document.getElementById('arc-path');
    const cpX = (riseX + setX) / 2;
    path.setAttribute('d', `M ${riseX} 170 Q ${cpX} ${midY - 30} ${setX} 170`);

    // Sun position: current time
    const now = new Date();
    const nowTs = now.getTime();
    let sunX, sunY;

    if (nowTs < rise.getTime()) {
      sunX = riseX;
      sunY = 170;
    } else if (nowTs > set.getTime()) {
      sunX = setX;
      sunY = 170;
    } else {
      const t = (nowTs - rise.getTime()) / (set.getTime() - rise.getTime());
      sunX = riseX + t * (setX - riseX);
      // Parabolic Y
      sunY = 170 - Math.sin(t * Math.PI) * 140;
    }

    const sunEl = document.getElementById('arc-sun');
    sunEl.setAttribute('cx', sunX);
    sunEl.setAttribute('cy', sunY);

    // Golden hour rects
    const gb = computeGoldenBlue(data);
    const gmStart = timeToX(new Date(gb.golden_morning_start).getTime());
    const gmEnd = Math.min(timeToX(new Date(gb.golden_morning_end).getTime()), noonX);
    const geStart = Math.max(timeToX(new Date(gb.golden_evening_start).getTime()), noonX);
    const geEnd = timeToX(new Date(gb.golden_evening_end).getTime());

    document.getElementById('golden-morn-rect').setAttribute('x', gmStart);
    document.getElementById('golden-morn-rect').setAttribute('width', Math.max(0, gmEnd - gmStart));
    document.getElementById('golden-eve-rect').setAttribute('x', geStart);
    document.getElementById('golden-eve-rect').setAttribute('width', Math.max(0, geEnd - geStart));

    // Labels
    document.getElementById('arc-rise-label').textContent = formatTime(data.sunrise);
    document.getElementById('arc-rise-label').setAttribute('x', riseX);
    document.getElementById('arc-set-label').textContent = formatTime(data.sunset);
    document.getElementById('arc-set-label').setAttribute('x', setX);
    document.getElementById('arc-noon-label').setAttribute('x', noonX);
  }

  // ===== WEEK GRID =====
  async function renderWeekGrid() {
    const grid = document.getElementById('week-grid');
    grid.innerHTML = '';

    const today = todayStr();
    state.weekData.forEach(({ date, data }, i) => {
      const d = new Date(date + 'T12:00:00');
      const dayName = d.toLocaleDateString([], { weekday: 'short' });
      const dayNum = d.getDate();
      const isToday = date === today;
      const isSelected = date === state.date;

      const dayLen = data.day_length || 0;
      // Max possible day length ~14h = 50400s, min ~8h = 28800s, normalize bar width 30-100%
      const barPct = Math.min(100, Math.max(20, (dayLen / 57600) * 100));

      const div = document.createElement('div');
      div.className = `week-day${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}`;
      div.setAttribute('tabindex', '0');
      div.setAttribute('role', 'button');
      div.setAttribute('aria-label', `${dayName} ${dayNum}: Sunrise ${formatTime(data.sunrise)}, Sunset ${formatTime(data.sunset)}`);
      div.innerHTML = `
        <div class="week-day-name">${dayName}</div>
        <div class="week-day-num">${dayNum}</div>
        <div class="week-day-bar" style="width:${barPct}%"></div>
        <div class="week-day-times">
          🌅 ${formatTime(data.sunrise)}<br>
          🌇 ${formatTime(data.sunset)}
        </div>
      `;
      div.addEventListener('click', () => {
        state.date = date;
        dateInput.value = date;
        state.sunData = data;
        renderSunCards(data, date);
        renderArc(data, date);
        renderTasks();
        grid.querySelectorAll('.week-day').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
      });
      div.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') div.click(); });
      grid.appendChild(div);
    });
  }

  // ===== TASK SCHEDULER =====
  function getAnchorTime(anchorKey) {
    if (!state.sunData) return null;
    const data = state.sunData;
    const gb = computeGoldenBlue(data);
    const map = {
      sunrise: data.sunrise,
      sunset: data.sunset,
      solar_noon: data.solar_noon,
      golden_morning: gb.golden_morning_start,
      golden_evening: gb.golden_evening_start,
      blue_morning: gb.blue_morning_start,
      blue_evening: gb.blue_evening_start,
      civil_twilight_begin: data.civil_twilight_begin,
      civil_twilight_end: data.civil_twilight_end,
    };
    return map[anchorKey] || null;
  }

  function computeTaskTime(task) {
    const anchor = getAnchorTime(task.anchor);
    if (!anchor) return null;
    const d = addMinutes(anchor, task.offset);
    return d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }) : null;
  }

  function renderTasks() {
    const list = document.getElementById('tasks-list');
    if (!state.tasks.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⏰</div><p>No tasks yet. Add a task to see it scheduled relative to sun times.</p></div>`;
      return;
    }
    list.innerHTML = state.tasks.map((t, i) => {
      const computed = computeTaskTime(t);
      const offsetStr = t.offset === 0 ? 'at' : (t.offset > 0 ? `+${t.offset}m after` : `${Math.abs(t.offset)}m before`);
      const anchorLabel = t.anchor.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      return `<div class="task-item" role="listitem">
        <div class="task-dot" style="background:${t.color}"></div>
        <div class="task-name">${t.name}</div>
        <div class="task-time-badge">${offsetStr} ${anchorLabel}</div>
        <div class="task-computed-time">${computed || (state.sunData ? '--:--' : 'Load location')}</div>
        <button class="task-delete" data-i="${i}" aria-label="Delete task ${t.name}">🗑</button>
      </div>`;
    }).join('');

    list.querySelectorAll('.task-delete').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.i);
        state.tasks.splice(i, 1);
        saveTasks();
        renderTasks();
        showToast('Task removed', 'info');
      });
    });
  }

  document.getElementById('btn-add-task').addEventListener('click', () => {
    const name = document.getElementById('task-name-input').value.trim();
    const anchor = document.getElementById('task-anchor').value;
    const offset = parseInt(document.getElementById('task-offset').value) || 0;
    const color = document.getElementById('task-color').value;

    if (!name) {
      showToast('Please enter a task name', 'error');
      document.getElementById('task-name-input').focus();
      return;
    }

    state.tasks.push({ name, anchor, offset, color, id: Date.now() });
    saveTasks();
    renderTasks();
    document.getElementById('task-name-input').value = '';
    showToast(`Task "${name}" added`, 'success');
  });

  // Allow Enter in task name to add
  document.getElementById('task-name-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-add-task').click();
  });

  // ===== SESSIONS =====
  function renderSessions() {
    const list = document.getElementById('sessions-list');
    if (!state.sessions.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📁</div><p>No saved sessions. Search a location and save your first shoot.</p></div>`;
      return;
    }
    list.innerHTML = state.sessions.map((s, i) => {
      const gb = computeGoldenBlue(s.data);
      return `<div class="session-card">
        <div class="session-card-header">
          <div>
            <div class="session-card-title">${s.name}</div>
            <div class="session-card-location">📌 ${s.location} · ${s.date}</div>
          </div>
        </div>
        <div class="session-card-badges">
          <span class="badge badge-gold">🌅 ${formatTime(s.data.sunrise)}</span>
          <span class="badge badge-gold">🌇 ${formatTime(s.data.sunset)}</span>
          <span class="badge badge-blue">☀️ ${formatDuration(s.data.day_length)}</span>
        </div>
        <div class="session-card-actions">
          <button class="btn btn-secondary btn-sm" data-i="${i}" id="share-btn-${i}">🔗 Share</button>
          <button class="btn btn-green btn-sm" data-i="${i}" id="ics-btn-${i}">📅 ICS</button>
          <button class="btn btn-danger btn-sm" data-i="${i}" id="del-btn-${i}">🗑 Delete</button>
        </div>
      </div>`;
    }).join('');

    state.sessions.forEach((s, i) => {
      document.getElementById(`share-btn-${i}`).addEventListener('click', () => openShareModal(s));
      document.getElementById(`ics-btn-${i}`).addEventListener('click', () => downloadICS(s));
      document.getElementById(`del-btn-${i}`).addEventListener('click', () => {
        state.sessions.splice(i, 1);
        saveSessions();
        renderSessions();
        showToast('Session deleted', 'info');
      });
    });
  }

  document.getElementById('btn-save-session').addEventListener('click', () => {
    if (!state.location || !state.sunData) { showToast('Load a location first', 'error'); return; }
    const name = prompt('Session name (e.g. "Morning Shoot – Yosemite"):') || `Shoot – ${state.location.name}`;
    if (!name) return;
    const session = {
      id: Date.now(),
      name,
      location: state.location.name,
      lat: state.location.lat,
      lng: state.location.lng,
      date: state.date,
      data: state.sunData,
      tasks: [...state.tasks],
    };
    state.sessions.unshift(session);
    saveSessions();
    renderSessions();
    showToast(`Session "${name}" saved!`, 'success');
    // Switch to sessions tab
    document.querySelector('[data-tab="sessions"]').click();
  });

  // ===== SHARE MODAL =====
  function openShareModal(session) {
    state.modalSession = session;
    const gb = computeGoldenBlue(session.data);
    const card = `📸 SHOOT SESSION CARD
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📌 Location : ${session.location}
📅 Date     : ${session.date}

🌅 Sunrise         : ${formatTime(session.data.sunrise)}
🌇 Sunset          : ${formatTime(session.data.sunset)}
☀️ Solar Noon      : ${formatTime(session.data.solar_noon)}
🌟 Morning Golden  : ${formatTime(gb.golden_morning_start)} – ${formatTime(gb.golden_morning_end)}
✨ Evening Golden  : ${formatTime(gb.golden_evening_start)} – ${formatTime(gb.golden_evening_end)}
💙 Morning Blue Hr : ${formatTime(gb.blue_morning_start)} – ${formatTime(gb.blue_morning_end)}
🌙 Evening Blue Hr : ${formatTime(gb.blue_evening_start)} – ${formatTime(gb.blue_evening_end)}
⏱️ Day Length      : ${formatDuration(session.data.day_length)}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Generated by Sunrise Sunset Scheduler`;

    document.getElementById('modal-share-card').textContent = card;
    document.getElementById('modal-backdrop').style.display = 'flex';
    document.getElementById('modal-close').focus();
  }

  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal-backdrop').style.display = 'none';
  });

  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-backdrop')) {
      document.getElementById('modal-backdrop').style.display = 'none';
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.getElementById('modal-backdrop').style.display = 'none';
  });

  document.getElementById('modal-copy-btn').addEventListener('click', async () => {
    const text = document.getElementById('modal-share-card').textContent;
    try {
      await navigator.clipboard.writeText(text);
      showToast('Copied to clipboard!', 'success');
    } catch {
      showToast('Select and copy manually', 'info');
    }
  });

  document.getElementById('modal-ics-btn').addEventListener('click', () => {
    if (state.modalSession) downloadICS(state.modalSession);
  });

  // ===== ICS EXPORT =====
  function toICSDate(isoStr) {
    if (!isoStr || isoStr === 'always_up' || isoStr === 'always_down') return null;
    const d = new Date(isoStr);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  }

  function makeICSEvent(uid, summary, dtstart, dtend, description) {
    return [
      'BEGIN:VEVENT',
      `UID:${uid}`,
      `SUMMARY:${summary}`,
      `DTSTART:${dtstart}`,
      `DTEND:${dtend}`,
      `DESCRIPTION:${description.replace(/\n/g, '\\n')}`,
      'STATUS:CONFIRMED',
      'END:VEVENT',
    ].join('\r\n');
  }

  function downloadICS(session) {
    const data = session.data;
    const gb = computeGoldenBlue(data);
    const events = [];

    if (data.sunrise && toICSDate(data.sunrise)) {
      events.push(makeICSEvent(
        `sunrise-${session.id}`,
        `🌅 Sunrise — ${session.name}`,
        toICSDate(data.sunrise),
        toICSDate(addMinutes(data.sunrise, 30)?.toISOString()),
        `Sunrise at ${session.location}`
      ));
    }

    if (gb.golden_morning_start && toICSDate(gb.golden_morning_start)) {
      events.push(makeICSEvent(
        `golden-am-${session.id}`,
        `🌟 Morning Golden Hour — ${session.name}`,
        toICSDate(gb.golden_morning_start),
        toICSDate(gb.golden_morning_end),
        `Morning golden hour at ${session.location}`
      ));
    }

    if (gb.golden_evening_start && toICSDate(gb.golden_evening_start)) {
      events.push(makeICSEvent(
        `golden-pm-${session.id}`,
        `✨ Evening Golden Hour — ${session.name}`,
        toICSDate(gb.golden_evening_start),
        toICSDate(gb.golden_evening_end),
        `Evening golden hour at ${session.location}`
      ));
    }

    if (data.sunset && toICSDate(data.sunset)) {
      events.push(makeICSEvent(
        `sunset-${session.id}`,
        `🌇 Sunset — ${session.name}`,
        toICSDate(data.sunset),
        toICSDate(addMinutes(data.sunset, 30)?.toISOString()),
        `Sunset at ${session.location}`
      ));
    }

    // Task events
    session.tasks?.forEach(task => {
      const anchor = (() => {
        const map = {
          sunrise: data.sunrise, sunset: data.sunset,
          solar_noon: data.solar_noon,
          golden_morning: gb.golden_morning_start,
          golden_evening: gb.golden_evening_start,
          blue_morning: gb.blue_morning_start,
          blue_evening: gb.blue_evening_start,
          civil_twilight_begin: data.civil_twilight_begin,
          civil_twilight_end: data.civil_twilight_end,
        };
        return map[task.anchor];
      })();
      if (!anchor) return;
      const taskStart = addMinutes(anchor, task.offset);
      const taskEnd = addMinutes(anchor, task.offset + 60);
      if (!taskStart || !taskEnd) return;
      events.push(makeICSEvent(
        `task-${task.id}-${session.id}`,
        `📸 ${task.name} — ${session.name}`,
        toICSDate(taskStart.toISOString()),
        toICSDate(taskEnd.toISOString()),
        `Scheduled: ${task.name} at ${session.location}`
      ));
    });

    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Sunrise Sunset Scheduler//EN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      ...events,
      'END:VCALENDAR',
    ].join('\r\n');

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${session.name.replace(/\s+/g, '-')}-${session.date}.ics`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('ICS file downloaded!', 'success');
  }

  // ===== TABS =====
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    });
  });

  // ===== INIT =====
  renderTasks();
  renderSessions();
</script>
</body>
</html>
